import com.google.firebase.FirebaseApp;
import com.google.firebase.auth.*;
import com.google.firebase.firestore.*;

import java.util.*;
import java.text.NumberFormat;

public class MainActivity extends Activity {

    private static final String STORE =
            "NEW BHARAT MEDICAL STORE";

    private static final String WHATSAPP =
            "919455612222";

    private static final int GREEN =
            Color.rgb(13, 112, 77);

    private static final int DARK_GREEN =
            Color.rgb(7, 75, 52);

    private static final int SAFFRON =
            Color.rgb(239, 157, 49);

    private static final int BACKGROUND =
            Color.rgb(246, 249, 247);

    private FirebaseAuth auth;
    private FirebaseFirestore db;

    private LinearLayout root;
    private LinearLayout content;

    private String verificationId = "";

    private final ArrayList<Medicine> medicines =
            new ArrayList<>();

    private final HashMap<String, Integer> cart =
            new HashMap<>();

    private final HashMap<String, Medicine> medicineMap =
            new HashMap<>();

    private final NumberFormat currency =
            NumberFormat.getCurrencyInstance(
                    new Locale("en", "IN")
            );

    private static class Medicine {
        String id;
        String name;
        String category;
        String description;
        double price;
        long stock;

        Medicine(
                String id,
                String name,
                String category,
                String description,
                double price,
                long stock
        ) {
            this.id = id;
            this.name = name;
            this.category = category;
            this.description = description;
            this.price = price;
            this.stock = stock;
        }
    }

    @Override
    public void onCreate(Bundle savedInstanceState) {

        super.onCreate(savedInstanceState);

        getWindow().setStatusBarColor(DARK_GREEN);
        getWindow().setNavigationBarColor(DARK_GREEN);

        FirebaseApp.initializeApp(this);

        auth = FirebaseAuth.getInstance();
        db = FirebaseFirestore.getInstance();

        if (auth.getCurrentUser() != null) {
            checkUserRole();
        } else {
            showLogin();
        }
    }

    private GradientDrawable background(
            int color,
            int radius
    ) {

        GradientDrawable drawable =
                new GradientDrawable();

        drawable.setColor(color);
        drawable.setCornerRadius(radius);

        return drawable;
    }

    private void createScreen(String title) {

        root = new LinearLayout(this);
        root.setOrientation(LinearLayout.VERTICAL);
        root.setBackgroundColor(BACKGROUND);

        TextView header = new TextView(this);

        header.setText(STORE + "\n" + title);
        header.setTextColor(Color.WHITE);
        header.setTextSize(18);
        header.setTypeface(null, Typeface.BOLD);
        header.setPadding(20, 22, 20, 22);
        header.setBackgroundColor(GREEN);

        root.addView(header);

        ScrollView scroll = new ScrollView(this);

        content = new LinearLayout(this);
        content.setOrientation(LinearLayout.VERTICAL);
        content.setPadding(18, 18, 18, 25);

        scroll.addView(content);

        root.addView(
                scroll,
                new LinearLayout.LayoutParams(
                        -1, 0, 1
                )
        );

        setContentView(root);
    }

    private TextView heading(String value) {

        TextView text = new TextView(this);

        text.setText(value);
        text.setTextSize(20);
        text.setTextColor(DARK_GREEN);
        text.setTypeface(null, Typeface.BOLD);
        text.setPadding(0, 15, 0, 10);

        content.addView(text);

        return text;
    }

    private TextView label(String value) {

        TextView text = new TextView(this);

        text.setText(value);
        text.setTextSize(15);
        text.setTextColor(Color.DKGRAY);
        text.setPadding(0, 8, 0, 8);

        content.addView(text);

        return text;
    }

    private EditText field(
            String hint,
            int inputType
    ) {

        EditText edit = new EditText(this);

        edit.setHint(hint);
        edit.setSingleLine(true);
        edit.setInputType(inputType);

        content.addView(edit);

        return edit;
    }

    private Button action(
            String title,
            Runnable operation
    ) {

        Button button = new Button(this);

        button.setText(title);
        button.setAllCaps(false);

        button.setTextColor(Color.WHITE);

        button.setBackgroundTintList(
                android.content.res.ColorStateList.valueOf(
                        GREEN
                )
        );

        LinearLayout.LayoutParams params =
                new LinearLayout.LayoutParams(
                        -1, -2
                );

        params.setMargins(0, 7, 0, 7);

        content.addView(button, params);

        button.setOnClickListener(
                view -> operation.run()
        );

        return button;
    }

    private void message(String value) {

        new AlertDialog.Builder(this)
                .setTitle(STORE)
                .setMessage(value)
                .setPositiveButton("OK", null)
                .show();
    }

    // CUSTOMER AUTHENTICATION

    private void showLogin() {

        createScreen("Customer & Admin Login");

        heading("Welcome!");

        label(
                "Login securely using your registered mobile number."
        );

        EditText phone = field(
                "Mobile number (+91XXXXXXXXXX)",
                InputType.TYPE_CLASS_PHONE
        );

        EditText otp = field(
                "Enter 6-digit OTP",
                InputType.TYPE_CLASS_NUMBER
        );

        action("SEND OTP", () -> {

            String number =
                    phone.getText().toString().trim();

            if (!number.startsWith("+") ||
                    number.length() < 10) {

                message("Please enter a valid mobile number with country code.");

                return;
            }

            sendOtp(number);

        });

        action("VERIFY OTP", () -> {

            String code =
                    otp.getText().toString().trim();

            if (verificationId.isEmpty() ||
                    code.length() != 6) {

                message("Please request and enter a valid OTP.");

                return;
            }

            PhoneAuthCredential credential =
                    PhoneAuthProvider.getCredential(
                            verificationId,
                            code
                    );

            auth.signInWithCredential(credential)
                    .addOnSuccessListener(
                            result -> checkUserRole()
                    )
                    .addOnFailureListener(
                            error -> message(
                                    "Login failed: " +
                                    error.getMessage()
                            )
                    );

        });

        label(
                "Admin access is restricted to the authorized store administrator."
        );

        action("CONTACT STORE ON WHATSAPP", this::openWhatsApp);
    }

    private void sendOtp(String number) {

        PhoneAuthOptions options =
                PhoneAuthOptions.newBuilder(auth)
                        .setPhoneNumber(number)
                        .setTimeout(
                                60L,
                                java.util.concurrent.TimeUnit.SECONDS
                        )
                        .setActivity(this)
                        .setCallbacks(
                                new PhoneAuthProvider
                                        .OnVerificationStateChangedCallbacks() {

                                    @Override
                                    public void onVerificationCompleted(
                                            PhoneAuthCredential credential
                                    ) {

                                        auth.signInWithCredential(credential)
                                                .addOnSuccessListener(
                                                        result -> checkUserRole()
                                                )
                                                .addOnFailureListener(
                                                        error -> message(
                                                                error.getMessage()
                                                        )
                                                );
                                    }

                                    @Override
                                    public void onVerificationFailed(
                                            FirebaseException exception
                                    ) {

                                        message(
                                                "OTP error: " +
                                                exception.getMessage()
                                        );
                                    }

                                    @Override
                                    public void onCodeSent(
                                            String id,
                                            PhoneAuthProvider.ForceResendingToken token
                                    ) {

                                        verificationId = id;

                                        message(
                                                "OTP sent successfully."
                                        );
                                    }
                                }
                        )
                        .build();

        PhoneAuthProvider.verifyPhoneNumber(options);
    }

    // ROLE VERIFICATION

    private void checkUserRole() {

        FirebaseUser user =
                auth.getCurrentUser();

        if (user == null) {
            showLogin();
            return;
        }

        String uid = user.getUid();

        db.collection("admins")
                .document(uid)
                .get()
                .addOnSuccessListener(document -> {

                    boolean admin =
                            document.exists() &&
                            Boolean.TRUE.equals(
                                    document.getBoolean("active")
                            );

                    if (admin) {
                        showAdminDashboard();
                    } else {
                        showCustomerDashboard();
                    }

                })
                .addOnFailureListener(
                        error -> message(
                                "Unable to verify access: " +
                                error.getMessage()
                        )
                );
    }

    // CUSTOMER DASHBOARD

    private void showCustomerDashboard() {

        createScreen("Customer Dashboard");

        heading("Welcome to New Bharat Medical Store");

        label(
                "Your trusted pharmacy in Ghosi, Mau."
        );

        EditText search = field(
                "Search medicines",
                InputType.TYPE_CLASS_TEXT
        );

        action("SEARCH MEDICINES", () ->
                loadMedicines(
                        search.getText().toString().trim()
                )
        );

        action("ALL MEDICINES", () ->
                loadMedicines("")
        );

        action("MY SHOPPING CART", this::showCart);

        action("MY ORDERS", this::showMyOrders);

        action("WHATSAPP ORDERING", this::openWhatsApp);

        action("SIGN OUT", this::signOut);

        loadMedicines("");
    }

    // MEDICINE CATALOGUE

    private void loadMedicines(String search) {

        db.collection("medicines")
                .whereEqualTo("active", true)
                .get()
                .addOnSuccessListener(result -> {

                    medicines.clear();
                    medicineMap.clear();

                    for (DocumentSnapshot document :
                            result.getDocuments()) {

                        String name =
                                document.getString("name");

                        if (name == null) continue;

                        String category =
                                document.getString("category");

                        String description =
                                document.getString("description");

                        Double price =
                                document.getDouble("price");

                        Long stock =
                                document.getLong("stock");

                        Medicine medicine = new Medicine(
                                document.getId(),
                                name,
                                category == null ? "General" : category,
                                description == null ? "" : description,
                                price == null ? 0 : price,
                                stock == null ? 0 : stock
                        );

                        if (search.isEmpty() ||
                                name.toLowerCase().contains(
                                        search.toLowerCase()
                                )) {

                            medicines.add(medicine);

                            medicineMap.put(
                                    medicine.id,
                                    medicine
                            );
                        }
                    }

                    showMedicineList();

                })
                .addOnFailureListener(
                        error -> message(
                                "Unable to load medicines: " +
                                error.getMessage()
                        )
                );
    }

    private void showMedicineList() {

        content.removeAllViews();

        heading("Medicine Catalogue");

        if (medicines.isEmpty()) {

            label(
                    "No matching medicines are currently available."
            );

            action("BACK TO HOME",
                    this::showCustomerDashboard);

            return;
        }

        for (Medicine medicine : medicines) {

            LinearLayout card =
                    new LinearLayout(this);

            card.setOrientation(
                    LinearLayout.VERTICAL
            );

            card.setPadding(14, 12, 14, 12);
            card.setBackground(
                    background(Color.WHITE, 18)
            );

            TextView name = new TextView(this);

            name.setText(medicine.name);
            name.setTextSize(17);
            name.setTypeface(null, Typeface.BOLD);
            name.setTextColor(DARK_GREEN);

            card.addView(name);

            TextView details = new TextView(this);

            details.setText(
                    medicine.category +
                    "\nPrice: " +
                    currency.format(medicine.price) +
                    "\nStock: " +
                    medicine.stock
            );

            details.setTextSize(14);
            details.setTextColor(Color.DKGRAY);

            card.addView(details);

            Button add = new Button(this);

            add.setText("ADD TO CART");
            add.setAllCaps(false);

            card.addView(add);

            add.setOnClickListener(view -> {

                if (medicine.stock <= 0) {

                    message("This medicine is out of stock.");

                    return;
                }

                int quantity =
                        cart.getOrDefault(
                                medicine.id, 0
                        );

                if (quantity >= medicine.stock) {

                    message("Available stock limit reached.");

                    return;
                }

                cart.put(
                        medicine.id,
                        quantity + 1
                );

                message(
                        medicine.name +
                        " added to your cart."
                );
            });

            LinearLayout.LayoutParams params =
                    new LinearLayout.LayoutParams(
                            -1, -2
                    );

            params.setMargins(0, 8, 0, 8);

            content.addView(card, params);
        }

        action("VIEW CART", this::showCart);

        action("HOME", this::showCustomerDashboard);
    }

    // SHOPPING CART

    private void showCart() {

        createScreen("Shopping Cart");

        heading("Your Shopping Cart");

        if (cart.isEmpty()) {

            label("Your cart is empty.");

            action("CONTINUE SHOPPING",
                    this::showCustomerDashboard);

            return;
        }

        final double[] total = {0};

        for (String id : new ArrayList<>(cart.keySet())) {

            Medicine medicine =
                    medicineMap.get(id);

            if (medicine == null) continue;

            int quantity = cart.get(id);

            double amount =
                    medicine.price * quantity;

            total[0] += amount;

            label(
                    medicine.name +
                    " × " + quantity +
                    " = " + currency.format(amount)
            );

            action(
                    "REMOVE ONE",
                    () -> {

                        int current =
                                cart.getOrDefault(id, 0);

                        if (current <= 1) {
                            cart.remove(id);
                        } else {
                            cart.put(id, current - 1);
                        }

                        showCart();
                    }
            );
        }

        heading(
                "Total: " +
                currency.format(total[0])
        );

        action(
                "PLACE COD ORDER REQUEST",
                this::placeOrder
        );

        action(
                "CONTINUE SHOPPING",
                this::showCustomerDashboard
        );
    }

    // ORDER PLACEMENT

    private void placeOrder() {

        FirebaseUser user =
                auth.getCurrentUser();

        if (user == null || cart.isEmpty()) {
            message("Your cart is empty.");
            return;
        }

        ArrayList<Map<String, Object>> items =
                new ArrayList<>();

        double total = 0;

        for (String id : cart.keySet()) {

            Medicine medicine =
                    medicineMap.get(id);

            if (medicine == null) continue;

            int quantity = cart.get(id);

            Map<String, Object> item =
                    new HashMap<>();

            item.put("medicineId", id);
            item.put("name", medicine.name);
            item.put("quantity", quantity);
            item.put("unitPrice", medicine.price);

            items.add(item);

            total += medicine.price * quantity;
        }

        Map<String, Object> order =
                new HashMap<>();

        order.put("uid", user.getUid());
        order.put("items", items);
  
